name: Build iOS IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create . --platforms ios
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --project-name=studio_musicale_app --dart-define=BUNDLE_ID=com.tuonome.studiomusicale
      - name: Create IPA
        run: |
          mkdir -p Payload
          # Questo comando trova l'app ovunque sia stata creata e la mette in Payload
          find build/ios/iphoneos -name "*.app" -exec cp -r {} Payload/ \;
          zip -r app.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-app-ipa
          path: app.ipa
