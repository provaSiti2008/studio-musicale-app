name: Build iOS IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create . --platforms ios --org com.studiomusicale

      # MODIFICA PROFONDA: Iniettiamo il blocco totale del signing nel progetto Xcode
      - run: |
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.example.studioMusicaleApp/PRODUCT_BUNDLE_IDENTIFIER = com.studiomusicale.app/g' ios/Runner.xcodeproj/project.pbxproj
          # Questa riga aggiunge l'istruzione per saltare il controllo del team
          echo "CODE_SIGN_IDENTITY = -" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Generated.xcconfig
          echo "AD_HOC_CODE_SIGNING_ALLOWED = YES" >> ios/Flutter/Generated.xcconfig

      - run: flutter pub get

      # Proviamo la build puntando esplicitamente a non firmare
      - run: flutter build ios --release --no-codesign --extra-gen-snapshot-options=--no-clean

      - name: Create IPA
        run: |
          mkdir -p Payload
          find build/ios/iphoneos -name "*.app" -exec cp -r {} Payload/ \;
          zip -r app.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-app-ipa
          path: app.ipa
