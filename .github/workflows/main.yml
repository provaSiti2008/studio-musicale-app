name: Build iOS IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. Creiamo la struttura iOS da zero
      - run: flutter create . --platforms ios --org com.studiomusicale

      # 2. Questa riga corregge l'errore del Bundle ID/Team
      - run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.example.studioMusicaleApp/PRODUCT_BUNDLE_IDENTIFIER = com.studiomusicale.app/g' ios/Runner.xcodeproj/project.pbxproj

      - run: flutter pub get

      # 3. Comando di build pulito (senza opzioni sbagliate)
      - run: flutter build ios --release --no-codesign

      # 4. Creazione pacchetto IPA
      - name: Create IPA
        run: |
          mkdir -p Payload
          find build/ios/iphoneos -name "*.app" -exec cp -r {} Payload/ \;
          zip -r app.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: my-app-ipa
          path: app.ipa
